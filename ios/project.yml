name: Mutuals
options:
  bundleIdPrefix: com.joshuawolf
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # The only signing team on this Mac. J8M8Z862Z7 was here until 2026-08-16
    # and does not exist in Xcode's team list, so every build failed to sign.
    # Read the real one with:
    #   defaults read com.apple.dt.Xcode IDEProvisioningTeamByIdentifier
    DEVELOPMENT_TEAM: YHTTPDR58N
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Mutuals:
    type: application
    platform: iOS
    sources:
      - path: Mutuals
        excludes:
          - "Resources/Info.plist"
          - "Resources/Mutuals.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joshuawolf.mutuals
        PRODUCT_NAME: Mutuals
        INFOPLIST_FILE: Mutuals/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        # Associated Domains needs a paid Apple Developer membership. On a free
        # personal team the entitlement will not provision, so it is opt-in and
        # empty by default:
        #   ./run.sh                    builds without universal links
        #   ./run.sh --universal-links  builds with them
        # Sign-in works either way: without the entitlement the app takes the
        # sign-in link off the clipboard instead of being handed it by Mail.
        CODE_SIGN_ENTITLEMENTS: ${MUTUALS_ENTITLEMENTS}
