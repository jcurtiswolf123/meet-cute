<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mutuals IG Story 4 - Dinners</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1920px;overflow:hidden;}
  body{background:#171714;color:#f4f1ea;font-family:'Instrument Sans',sans-serif;position:relative;}
  body::before{content:"";position:absolute;inset:0;
    background:radial-gradient(820px 640px at 18% 88%, rgba(118,45,56,.30), transparent 60%);}

  .frame{position:absolute;inset:0;display:flex;flex-direction:column;padding:250px 88px 300px;}

  .brand{display:flex;align-items:baseline;justify-content:space-between;}
  .brand .nm{font-family:'Instrument Serif',serif;font-size:44px;line-height:1;letter-spacing:-.01em;}
  .brand .lab{font-size:20px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:rgba(244,241,234,.55);}

  .table{margin-top:104px;display:flex;gap:14px;align-items:center;}
  .table span{width:52px;height:52px;border-radius:50%;border:1.5px solid rgba(244,241,234,.35);}
  .table span:nth-child(4),.table span:nth-child(9){background:#762d38;border-color:#762d38;}

  h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:136px;line-height:.94;
    letter-spacing:-.03em;margin-top:56px;max-width:11ch;}
  h1 em{font-style:italic;color:#e2b7bd;}

  .sub{margin-top:64px;max-width:27ch;font-size:38px;line-height:1.45;color:rgba(244,241,234,.72);}
  .sub b{color:#f4f1ea;font-weight:600;}

  .meta{margin-top:auto;padding-top:32px;border-top:1px solid rgba(244,241,234,.18);
    display:grid;grid-template-columns:1fr 1fr;gap:20px 40px;
    font-size:27px;font-weight:500;color:rgba(244,241,234,.62);}

  .cta{margin-top:72px;display:flex;align-items:center;gap:28px;}
  .cta .btn{background:#f4f1ea;color:#171714;font-weight:700;font-size:38px;
    padding:30px 52px;border-radius:999px;letter-spacing:-.01em;}
  .cta .url{font-size:30px;font-weight:500;color:rgba(244,241,234,.55);}

  .sticker-hint{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);
    font-size:24px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:rgba(244,241,234,.45);}
</style>
</head>
<body>
  <div class="frame">
    <div class="brand">
      <span class="nm">Mutuals</span>
      <span class="lab">Dinners</span>
    </div>

    <div class="table">
      <span></span><span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>

    <h1>Twelve people. <em>One long table.</em></h1>

    <p class="sub">Monthly dinners in New York, San Francisco and Los Angeles, with <b>no pressure to pair off.</b></p>

    <div class="meta">
      <span>Monthly</span>
      <span>Twelve seats</span>
      <span>Members and applicants</span>
      <span>NY &middot; SF &middot; LA</span>
    </div>

    <div class="cta">
      <span class="btn">Apply to join</span>
      <span class="url">hellomutuals.com</span>
    </div>
  </div>

  <div class="sticker-hint">&uarr; tap the link to apply</div>
</body>
</html>
