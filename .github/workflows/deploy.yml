name: Deploy to Fly

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meetcute
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d meetcute"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/meetcute?schema=meetcute
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/meetcute?schema=meetcute
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run db:deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:launch
      - run: npm run test:race
      - run: npm run test:journey:email
      # Full production build gate: catch build-time breakage (bad imports, RSC
      # boundary errors, font/axes config) before we ship, not on the Fly builder.
      # NEXT_PUBLIC_* is inlined at build time, so the artifact the browser
      # checks run against has to be built knowing the URL it will be served on.
      # Built without it, the app has no base URL and the operator invite path
      # silently skips the sign-in link it is supposed to send.
      # The key is passed here too so the build gate produces the same shape of
      # artifact production does, and so test:launch:actionids can check the key
      # actually reached Next rather than only that the plumbing looks right.
      - run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3009
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
      - name: Check server action ids are pinned to the key
        run: npm run test:launch:actionids
        env:
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
      - run: npx playwright install --with-deps chromium
      - name: Run operator role browser checks
        run: |
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static
          cp -R public .next/standalone/public
          PORT=3009 HOSTNAME=127.0.0.1 NEXT_PUBLIC_APP_URL="http://127.0.0.1:3009" \
            node .next/standalone/server.js > /tmp/mutuals-role-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3009/healthz > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              tail -100 /tmp/mutuals-role-server.log
              exit 1
            fi
            sleep 1
          done
          # A browser check that fails on a server-side error leaves the only
          # useful evidence in the server log, which used to be discarded with
          # the runner. Print it on any failure.
          dump_server_log() {
            echo "----- server log (${1}) -----"
            tail -200 /tmp/mutuals-role-server.log
            echo "-----------------------------"
          }
          npm run test:launch:roles:e2e || { dump_server_log roles:e2e; exit 1; }
          npm run test:journey:application || { dump_server_log journey:application; exit 1; }
          npm run test:journey:controls || { dump_server_log journey:controls; exit 1; }
          npm run test:journey:vouch || { dump_server_log journey:vouch; exit 1; }
          npm run test:journey:signin || { dump_server_log journey:signin; exit 1; }
          npm run test:journey:nativeforms || { dump_server_log journey:nativeforms; exit 1; }
          npm run test:journey:skew || { dump_server_log journey:skew; exit 1; }

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    concurrency: deploy-mutuals
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Apply additive database schema
        run: npm run db:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
      # pinned to a commit SHA (supply-chain): superfly/flyctl-actions setup-flyctl
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      # Two separate things, both about somebody who is mid-application when we
      # ship.
      #
      # NEXT_SERVER_ACTIONS_ENCRYPTION_KEY is the one that matters: it keeps
      # server action ids identical from build to build, so a page loaded before
      # this deploy still submits successfully after it. Without it Next mints a
      # random key per build and all 58 ids change, which is what stranded an
      # applicant on 4 August. Refuse to deploy without it rather than ship a
      # build that silently breaks every open page.
      #
      # NEXT_DEPLOYMENT_ID stamps assets with the commit, so each build gets its
      # own cache entries and a genuine skew is visible rather than a mystery.
      - name: Deploy
        run: |
          if [ -z "$NEXT_SERVER_ACTIONS_ENCRYPTION_KEY" ]; then
            echo "NEXT_SERVER_ACTIONS_ENCRYPTION_KEY is not set. Deploying without it"
            echo "would change every server action id and break every page currently open."
            exit 1
          fi
          set -- --remote-only \
            --build-arg NEXT_DEPLOYMENT_ID="$GITHUB_SHA" \
            --build-secret NEXT_SERVER_ACTIONS_ENCRYPTION_KEY="$NEXT_SERVER_ACTIONS_ENCRYPTION_KEY"
          if [ -n "$SENTRY_AUTH_TOKEN" ]; then
            set -- "$@" --build-secret SENTRY_AUTH_TOKEN="$SENTRY_AUTH_TOKEN"
          fi
          flyctl deploy "$@"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
      - name: Verify production canary
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 https://hellomutuals.com/healthz
          curl --fail --silent --show-error --retry 5 --retry-delay 3 https://hellomutuals.com/readyz
          curl --fail --silent --show-error --retry 5 --retry-delay 3 https://hellomutuals.com/ > /dev/null
