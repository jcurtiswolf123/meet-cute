<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · Mutuals</title>
    <!-- Deliberately self-contained. This page is served when the network is
         gone, so it cannot fetch a stylesheet or a webfont. -->
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem max(1.5rem, env(safe-area-inset-left)) max(2rem, env(safe-area-inset-bottom));
        background: #f4f1ea;
        color: #171714;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { max-width: 30rem; text-align: left; }
      .mark {
        width: 2.75rem;
        height: 2.75rem;
        border-radius: 50%;
        background: #762d38;
        color: #f4f1ea;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.35rem;
      }
      h1 { margin: 1.75rem 0 0; font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: 2rem; line-height: 1.15; }
      p { margin: 0.75rem 0 0; font-size: 1rem; line-height: 1.6; color: #57544d; max-width: 34ch; }
      button {
        margin-top: 1.75rem;
        min-height: 2.75rem;
        padding: 0 1.5rem;
        border: 0;
        border-radius: 999px;
        background: #171714;
        color: #f4f1ea;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:active { transform: scale(0.98); }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">M</div>
      <h1>No connection</h1>
      <p>
        Mutuals needs the network: your matches, your introductions and your profile all live on the
        server, not on this phone. Nothing has been lost.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
